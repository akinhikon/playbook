  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

  <style>

<body style="background: #EBE7DC; margin: 0; padding: 0;">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useCallback, useEffect, useRef, createContext, useContext } = React;

    // ============================================================
    // SVG Icons
    // ============================================================
    const SvgIcon = ({ children, size = 16, className = "", style = {} }) => (
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width={size}
        height={size}
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        strokeWidth="2"
        strokeLinecap="round"
        strokeLinejoin="round"
        className={className}
        style={{ flexShrink: 0, display: "inline-block", ...style }}
      >
        {children}
      </svg>
    );

    const Plus = (p) => <SvgIcon {...p}><path d="M5 12h14"/><path d="M12 5v14"/></SvgIcon>;
    const Trash2 = (p) => <SvgIcon {...p}><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></SvgIcon>;
    const ChevronDown = (p) => <SvgIcon {...p}><path d="m6 9 6 6 6-6"/></SvgIcon>;
    const ChevronRight = (p) => <SvgIcon {...p}><path d="m9 18 6-6-6-6"/></SvgIcon>;
    const ChevronLeft = (p) => <SvgIcon {...p}><path d="m15 18-6-6 6-6"/></SvgIcon>;
    const TrendingDown = (p) => <SvgIcon {...p}><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></SvgIcon>;
    const TrendingUp = (p) => <SvgIcon {...p}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></SvgIcon>;
    const Minus = (p) => <SvgIcon {...p}><path d="M5 12h14"/></SvgIcon>;
    const FolderPlus = (p) => <SvgIcon {...p}><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/><line x1="12" x2="12" y1="10" y2="16"/><line x1="9" x2="15" y1="13" y2="13"/></SvgIcon>;
    const Pencil = (p) => <SvgIcon {...p}><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></SvgIcon>;
    const Wallet = (p) => <SvgIcon {...p}><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></SvgIcon>;
    const AlertTriangle = (p) => <SvgIcon {...p}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></SvgIcon>;
    const ShieldCheck = (p) => <SvgIcon {...p}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></SvgIcon>;
    const Power = (p) => <SvgIcon {...p}><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/></SvgIcon>;
    const PowerOff = (p) => <SvgIcon {...p}><path d="M18.36 6.64A9 9 0 0 1 20.77 15"/><path d="M6.16 6.16a9 9 0 1 0 12.68 12.68"/><path d="M12 2v4"/><path d="m2 2 20 20"/></SvgIcon>;
    const FileText = (p) => <SvgIcon {...p}><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></SvgIcon>;
    const Receipt = (p) => <SvgIcon {...p}><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M14 8H8"/><path d="M16 12H8"/><path d="M13 16H8"/></SvgIcon>;
    const Activity = (p) => <SvgIcon {...p}><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></SvgIcon>;
    const Link2 = (p) => <SvgIcon {...p}><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 1 1 0 10h-2"/><line x1="8" x2="16" y1="12" y2="12"/></SvgIcon>;
    const CreditCard = (p) => <SvgIcon {...p}><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></SvgIcon>;
    const BarChart3 = (p) => <SvgIcon {...p}><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></SvgIcon>;
    const Calendar = (p) => <SvgIcon {...p}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></SvgIcon>;
    const Save = (p) => <SvgIcon {...p}><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></SvgIcon>;
    const Loader2 = (p) => <SvgIcon {...p} className="animate-spin"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></SvgIcon>;
    const Settings = (p) => <SvgIcon {...p}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></SvgIcon>;
    const Undo2 = (p) => <SvgIcon {...p}><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></SvgIcon>;
    const Camera = (p) => <SvgIcon {...p}><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></SvgIcon>;

    // ----------------------------------------------------
    // Design Tokens & Helpers
    // ----------------------------------------------------
    const C = {
      bg: "#EBE7DC",
      surface: "#F7F4EC",
      surfaceAlt: "#E3DDCC",
      ink: "#211E1A",
      inkSoft: "#6B6558",
      border: "#CFC6AE",
      danger: "#B3261E",
      dangerSoft: "#F2DAD6",
      amber: "#C97A1A",
      amberSoft: "#F1DFC0",
      safe: "#2E5D45",
      safeSoft: "#DCE6DA",
    };

    const uid = () => Math.random().toString(36).slice(2, 10);
    const fmtDateLocal = (d) => {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    };
    const TODAY = fmtDateLocal(new Date());
    const addDays = (dateStr, n) => {
      const d = new Date(dateStr + "T00:00:00");
      d.setDate(d.getDate() + n);
      return fmtDateLocal(d);
    };
    const dayOfMonth = (dateStr) => new Date(dateStr + "T00:00:00").getDate();
    function isLastDayOfMonth(dateStr) {
      const d = new Date(dateStr + "T00:00:00");
      const next = new Date(d);
      next.setDate(d.getDate() + 1);
      return next.getMonth() !== d.getMonth();
    }
    function fixedCostMatchesDate(fc, dateStr) {
      return Number(fc.day) === 0 ? isLastDayOfMonth(dateStr) : dayOfMonth(dateStr) === Number(fc.day);
    }
    function fixedCostOccurrences(fc, startDate, days) {
      const occurrences = [];
      for (let i = 0; i <= days; i++) {
        const date = addDays(startDate, i);
        if (fixedCostMatchesDate(fc, date)) occurrences.push(date);
      }
      if (fc.overrideDate && occurrences.length > 0) occurrences[0] = fc.overrideDate;
      return occurrences;
    }
    const fmtShort = (dateStr) => {
      if (!dateStr) return "-";
      const d = new Date(dateStr + "T00:00:00");
      return `${d.getMonth() + 1}/${d.getDate()}`;
    };
    const fmtYen = (n) => (n < 0 ? "-" : "") + "¥" + Math.abs(Math.round(n || 0)).toLocaleString("ja-JP");
    const fmtMan = (n) => Math.round((n || 0) / 10000).toLocaleString("ja-JP");
    const fmtPct = (n) => `${((n || 0) * 100).toFixed(1)}%`;
    const sum = (arr, fn) => (arr || []).reduce((a, b) => a + (fn(b) || 0), 0);

    const COST_TYPES = ["材料費", "人件費", "外部人件費（タイミー等）", "外注費", "その他"];
    const INTERNAL_LABOR_TYPE = "人件費";
    const EXTERNAL_LABOR_TYPE = "外部人件費（タイミー等）";
    const SOURCES = ["Amazon", "モノタロウ", "AliExpress", "楽天市場", "Yahoo!ショッピング(PayPay)", "コーナン", "ビバホーム", "コメリ", "その他EC", "タイミー等(スポットワーク)", "振込先", "その他"];
    const METHOD_TYPE_LABEL = { credit: "クレジットカード", debit: "デビットカード", charge: "チャージ式（コーナンペイ等）", transfer: "銀行振込・現金" };
    const EVENT_TYPE_LABEL = { workday: "現場作業", meeting: "打ち合わせ", travel: "出張" };
    const PROJECT_COLORS = ["#3B5B8C", "#7A4FA0", "#B4653F", "#4A7A6E", "#8A5A3E"];

    // ----------------------------------------------------
    // Calculations
    // ----------------------------------------------------
    function lineItemLaborCost(li, laborRates) {
      const rate = (laborRates || []).find((r) => r.id === li.laborRateId);
      return (li.laborHours || 0) * (rate ? rate.hourlyRate : 0);
    }
    function materialItemAmount(m) {
      if (m.qty != null && m.unitPrice != null) return (m.qty || 0) * (m.unitPrice || 0);
      return m.amount || 0;
    }
    function costItemAmount(c) {
      if (c.qty != null && c.unitPrice != null) return (c.qty || 0) * (c.unitPrice || 0);
      return c.amount || 0;
    }
    function lineItemMaterialCost(li) {
      if (li.materialItems && li.materialItems.length > 0) return sum(li.materialItems, materialItemAmount);
      return li.materialCost || 0;
    }
    function lineItemCost(li, laborRates) {
      return lineItemMaterialCost(li) + lineItemLaborCost(li, laborRates) + (li.otherCost || 0);
    }
    function lineItemPrice(li, laborRates) {
      return lineItemCost(li, laborRates) * (1 + (li.marginPercent || 0) / 100);
    }
    function lineItemUnitPrice(li, laborRates) {
      const price = lineItemPrice(li, laborRates);
      return li.qty > 0 ? price / li.qty : price;
    }

    const categoryRevenue = (cat, laborRates) => sum(cat.lineItems || [], (li) => lineItemPrice(li, laborRates));
    const categoryBudget = (cat, laborRates) => sum(cat.lineItems || [], (li) => lineItemCost(li, laborRates));
    const categoryActual = (cat) => sum(cat.actualCosts || [], costItemAmount);

    function categoryStats(cat, laborRates) {
      const revenue = categoryRevenue(cat, laborRates);
      const budget = categoryBudget(cat, laborRates);
      const actual = categoryActual(cat);
      const estMargin = revenue > 0 ? (revenue - budget) / revenue : 0;
      const actMargin = revenue > 0 ? (revenue - actual) / revenue : 0;
      const ratio = budget > 0 ? actual / budget : actual > 0 ? 2 : 0;
      let status = "safe";
      if (ratio > 1.05) status = "danger";
      else if (ratio > 0.9) status = "amber";
      return { revenue, budget, actual, estMargin, actMargin, ratio, status };
    }
    const statusMeta = {
      safe: { label: "順調・余裕あり", color: C.safe, bg: C.safeSoft },
      amber: { label: "要注意", color: C.amber, bg: C.amberSoft },
      danger: { label: "赤字リスク", color: C.danger, bg: C.dangerSoft },
    };

    const projectRevenue = (p, laborRates) => sum(p.categories || [], (cat) => categoryRevenue(cat, laborRates));
    function overheadTotal(p, laborRates) {
      return sum((p.categories || []).filter((c) => c.isOverheadCategory), (cat) => categoryRevenue(cat, laborRates));
    }
    function effectiveSuppliesBudget(p, laborRates) {
      if (p.suppliesBudgetMode === "percent") {
        return overheadTotal(p, laborRates) * ((p.suppliesBudgetPercent || 0) / 100);
      }
      return p.suppliesBudgetManual || 0;
    }
    const projectBudget = (p, laborRates) => sum(p.categories || [], (cat) => categoryBudget(cat, laborRates)) + effectiveSuppliesBudget(p, laborRates);
    const projectActual = (p) =>
      sum(p.categories || [], categoryActual) + sum(p.suppliesLog || [], (c) => c.amount) + sum(p.toolsLog || [], (c) => c.amount);

    function projectStats(p, laborRates) {
      const revenue = projectRevenue(p, laborRates);
      const budget = projectBudget(p, laborRates);
      const actual = projectActual(p);
      const estMargin = revenue > 0 ? (revenue - budget) / revenue : 0;
      const actMargin = revenue > 0 ? (revenue - actual) / revenue : 0;
      const ratio = budget > 0 ? actual / budget : actual > 0 ? 2 : 0;
      let status = "safe";
      if (ratio > 1.05) status = "danger";
      else if (ratio > 0.9) status = "amber";
      return { revenue, budget, actual, estMargin, actMargin, ratio, status };
    }

    function allProjectCostEntries(p) {
      const entries = [];
      (p.categories || []).forEach((cat) => (cat.actualCosts || []).forEach((c) => entries.push({ ...c, amount: costItemAmount(c), groupLabel: cat.name })));
      (p.suppliesLog || []).forEach((c) => entries.push({ ...c, amount: costItemAmount(c), groupLabel: "消耗品" }));
      (p.toolsLog || []).forEach((c) => entries.push({ ...c, amount: costItemAmount(c), groupLabel: "工具" }));
      return entries;
    }

    function projectBenchmarkStats(p, laborRates) {
      const revenue = projectRevenue(p, laborRates);
      const suppliesActual = sum(p.suppliesLog || [], (c) => c.amount);
      const toolsActual = sum(p.toolsLog || [], (c) => c.amount);
      const externalLaborActual = sum(p.categories || [], (cat) => sum((cat.actualCosts || []).filter((c) => c.type === EXTERNAL_LABOR_TYPE), costItemAmount));
      return {
        revenue,
        suppliesActual,
        toolsActual,
        externalLaborActual,
        suppliesPct: revenue > 0 ? suppliesActual / revenue : 0,
        toolsPct: revenue > 0 ? toolsActual / revenue : 0,
        laborPct: revenue > 0 ? externalLaborActual / revenue : 0,
      };
    }
    function aggregateBenchmark(projects, laborRates) {
      const rows = (projects || []).map((p) => ({ project: p, stats: projectBenchmarkStats(p, laborRates) }));
      const totalRevenue = sum(rows, (r) => r.stats.revenue);
      const totalSupplies = sum(rows, (r) => r.stats.suppliesActual);
      const totalTools = sum(rows, (r) => r.stats.toolsActual);
      const totalLabor = sum(rows, (r) => r.stats.externalLaborActual);
      return {
        rows,
        totalRevenue,
        suppliesPct: totalRevenue > 0 ? totalSupplies / totalRevenue : 0,
        toolsPct: totalRevenue > 0 ? totalTools / totalRevenue : 0,
        laborPct: totalRevenue > 0 ? totalLabor / totalRevenue : 0,
        projectCount: (projects || []).length,
      };
    }

    function tradeAccuracyStats(projects, laborRates) {
      const map = {};
      (projects || []).forEach((p) =>
        (p.categories || [])
          .filter((cat) => !cat.isOverheadCategory)
          .forEach((cat) => {
            const stats = categoryStats(cat, laborRates);
            if (stats.revenue === 0 && stats.budget === 0) return;
            const key = cat.name.trim() || "（名称未設定）";
            if (!map[key]) map[key] = { name: key, count: 0, totalBudget: 0, totalActual: 0, totalRevenue: 0 };
            map[key].count += 1;
            map[key].totalBudget += stats.budget;
            map[key].totalActual += stats.actual;
            map[key].totalRevenue += stats.revenue;
          })
      );
      return Object.values(map)
        .map((r) => ({
          ...r,
          overrunPct: r.totalBudget > 0 ? r.totalActual / r.totalBudget - 1 : 0,
          actualMargin: r.totalRevenue > 0 ? (r.totalRevenue - r.totalActual) / r.totalRevenue : 0,
        }))
        .sort((a, b) => b.overrunPct - a.overrunPct);
    }

    function milestoneStats(totalQuote, m) {
      const amount = Math.round((totalQuote * (m.percent || 0)) / 100);
      const paid = sum(m.payments || [], (p) => p.amount);
      const remaining = amount - paid;
      let status = "pending";
      if (remaining <= 0) status = "complete";
      else if (paid > 0) status = "partial";
      const overdue = m.dueDate && m.dueDate < TODAY && remaining > 0;
      return { amount, paid, remaining, status, overdue };
    }
    const milestoneStatusMeta = {
      complete: { label: "入金完了", color: C.safe, bg: C.safeSoft },
      partial: { label: "一部入金", color: C.amber, bg: C.amberSoft },
      pending: { label: "未入金", color: C.inkSoft, bg: C.surfaceAlt },
    };

    function creditCardCashOutDate(dateStr, method) {
      const d = new Date(dateStr + "T00:00:00");
      const day = d.getDate();
      const closingDay = method.closingDay || 31;
      const paymentDay = method.paymentDay || 27;
      let monthsToAdd = method.paymentMonthOffset ?? 1;
      if (day > closingDay) monthsToAdd += 1;
      const paymentDate = new Date(d.getFullYear(), d.getMonth() + monthsToAdd, paymentDay);
      return fmtDateLocal(paymentDate);
    }

    function getCashOutInfo(cost, paymentMethods) {
      if (cost.type === INTERNAL_LABOR_TYPE) return { skip: true };
      if (!cost.date) return { skip: true };
      const method = (paymentMethods || []).find((m) => m.id === cost.paymentMethodId);
      if (!method) return { date: cost.date, skip: false };
      if (method.type === "credit") {
        const instant = cost.instantRepay ?? true;
        return { date: instant ? cost.date : creditCardCashOutDate(cost.date, method), skip: false };
      }
      if (method.type === "charge") return { skip: true };
      return { date: cost.date, skip: false };
    }

    function methodOutstanding(method, projects, paymentMethods) {
      let total = 0;
      (projects || []).filter((p) => p.active).forEach((p) =>
        allProjectCostEntries(p).forEach((c) => {
          if (c.paymentMethodId !== method.id) return;
          const info = getCashOutInfo(c, paymentMethods);
          if (!info.skip && info.date >= TODAY) total += c.amount;
        })
      );
      return total;
    }
    function chargeBalance(method, projects) {
      const charged = sum(method.topUps || [], (t) => t.amount);
      let used = 0;
      (projects || []).forEach((p) =>
        allProjectCostEntries(p).forEach((c) => {
          if (c.type !== INTERNAL_LABOR_TYPE && c.paymentMethodId === method.id) used += c.amount;
        })
      );
      return charged - used;
    }
    function outstandingCardTotal(projects, paymentMethods) {
      return sum(
        (paymentMethods || []).filter((m) => m.type === "credit"),
        (m) => methodOutstanding(m, projects, paymentMethods)
      );
    }

    // ----------------------------------------------------
    // Robust Native SVG Cashflow Chart
    // ----------------------------------------------------
    function CashflowChart({ days }) {
      const [hoverIdx, setHoverIdx] = useState(null);
      if (!days || days.length === 0) return null;

      const balances = days.map((d) => d.balance || 0);
      const minVal = Math.min(0, ...balances);
      const maxVal = Math.max(100000, ...balances);
      const range = maxVal - minVal || 1;

      const width = 700;
      const height = 220;
      const padTop = 15;
      const padBottom = 25;
      const padLeft = 45;
      const padRight = 15;

      const plotW = width - padLeft - padRight;
      const plotH = height - padTop - padBottom;

      const getY = (val) => padTop + plotH - ((val - minVal) / range) * plotH;
      const getX = (idx) => padLeft + (idx / Math.max(1, days.length - 1)) * plotW;
      const zeroY = getY(0);

      let pathD = `M ${getX(0)} ${getY(days[0].balance || 0)}`;
      for (let i = 1; i < days.length; i++) {
        const prevX = getX(i - 1);
        const currX = getX(i);
        const currY = getY(days[i].balance || 0);
        const prevY = getY(days[i - 1].balance || 0);
        pathD += ` L ${currX} ${prevY} L ${currX} ${currY}`;
      }

      const activeDay = hoverIdx !== null ? days[hoverIdx] : null;

      return (
        <div className="relative w-full overflow-hidden select-none">
          <svg

                <rect

                  y={padTop}
                  width={colW}
                  height={plotH}
                  fill="transparent"
                  onMouseEnter={() => setHoverIdx(i)}

                <line x1={getX(hoverIdx)} y1={padTop} x2={getX(hoverIdx)} y2={padTop + plotH} stroke={C.inkSoft} strokeDasharray="2 2" />

          {activeDay && (

                background: C.surface,
                border: `1px solid ${C.border}`,
                left: `${Math.min(Math.max(10, (hoverIdx / days.length) * 100), 70)}%`,

            >

                <span className="mono font-bold" style={{ color: (activeDay.balance || 0) < 0 ? C.danger : C.safe }}>{fmtYen(activeDay.balance || 0)}</span>

              {activeDay.events && activeDay.events.length > 0 ? (

              ) : (

              )}

    async function storageGet(key) {
      try {
        if (typeof window !== "undefined" && window.storage) {
          const res = await window.storage.get(key, false);
          return res ? JSON.parse(res.value) : null;
        }
        const val = localStorage.getItem(`playbook_${key}`);
        return val ? JSON.parse(val) : null;
      } catch (e) {
        return null;
      }
    }
    async function storageSet(key, value) {
      try {
        if (typeof window !== "undefined" && window.storage) {
          await window.storage.set(key, JSON.stringify(value), false);
          return { ok: true };
        }
        localStorage.setItem(`playbook_${key}`, JSON.stringify(value));
        return { ok: true };
      } catch (e) {
        return { ok: false, key, error: e?.message || String(e) };
      }
    }
    async function storageDelete(key) {
      try {
        if (typeof window !== "undefined" && window.storage) {
          await window.storage.delete(key, false);
          return;
        }
        localStorage.removeItem(`playbook_${key}`);
      } catch (e) {}
    }

    async function saveEntriesSequentially(entries) {
      const results = [];
      for (const [key, value] of entries) {
        results.push(await storageSet(key, value));
      }
      return results;
    }

    async function applyMigrations(data) {
      let next = data;
      const applied = (await storageGet("applied-migrations")) || [];
      let changed = false;
      for (const m of MIGRATIONS) {
        if (!applied.includes(m.id)) {
          next = m.apply(next) || next;
          applied.push(m.id);
          changed = true;
        }
      }
      if (changed) {
        await saveEntriesSequentially([
          ["applied-migrations", applied],
          ["project-index", { projectIds: next.projects.map((p) => p.id), activeProjectId: next.activeProjectId }],
          ["company-settings", next.company],
          ...next.projects.map((p) => [`project-${p.id}`, p]),
        ]);
      }
      return next;
    }

    async function loadAllData() {
      const company = await storageGet("company-settings");
      const index = await storageGet("project-index");
      const projectIds = index?.projectIds || [];
      const loadedProjects = [];
      for (const id of projectIds) {
        loadedProjects.push(await storageGet(`project-${id}`));
      }
      const projects = loadedProjects.map(mergeProject).filter(Boolean);
      const result = {
        company: mergeCompany(company),
        projects,
        activeProjectId: index?.activeProjectId || projects[0]?.id || null,
      };
      return applyMigrations(result);
    }

    function NumberCell({ value, onChange, small, style, ...rest }) {

    function useSimulation(company, projects) {
      return useMemo(() => {
        const days = [];
        let running = company.initialBalance || 0;
        const activeProjects = (projects || []).filter((p) => p.active);
        const activeFixedCosts = (company.fixedCosts || []).filter((fc) => fc.active !== false);
        const simDays = company.simulationDays || 90;
        const fixedCostOccurrenceSets = activeFixedCosts.map((fc) => new Set(fixedCostOccurrences(fc, TODAY, simDays)));

        for (let i = 0; i <= simDays; i++) {
          const date = addDays(TODAY, i);
          let delta = 0;
          const events = [];

          activeFixedCosts.forEach((fc, idx) => {
            if (fixedCostOccurrenceSets[idx] && fixedCostOccurrenceSets[idx].has(date)) {
              delta -= (fc.amount || 0);
              events.push({ label: fc.name, amount: -(fc.amount || 0) });
            }
          });

          (company.loans || [])
            .filter((l) => l.active)
            .forEach((l) => {
              const effectiveDate = addDays(l.dueDate, Number(l.delayDays) || 0);
              if (effectiveDate === date) {
                const interest = l.delayDays > 0 ? Math.round(((l.amount || 0) * (l.interestRate / 100) * l.delayDays) / 365) : 0;
                const total = (l.amount || 0) + interest;
                delta -= total;
                events.push({ label: `${l.person}｜返済`, amount: -total });
              }
            });

          (company.paymentMethods || [])
            .filter((m) => m.type === "charge")
            .forEach((m) => {
              (m.topUps || []).forEach((t) => {
                if (t.date === date) {
                  delta -= (t.amount || 0);
                  events.push({ label: `${m.name}｜チャージ`, amount: -(t.amount || 0) });
                }
              });
            });

          activeProjects.forEach((p) => {
            const totalQuote = projectRevenue(p, company.laborRates);
            (p.milestones || []).forEach((m) => {
              const ms = milestoneStats(totalQuote, m);
              if (ms.remaining > 0 && m.dueDate === date) {
                delta += ms.remaining;
                events.push({ label: `${p.name}｜${m.label} 入金`, amount: ms.remaining });
              }
            });
            allProjectCostEntries(p).forEach((c) => {
              const info = getCashOutInfo(c, company.paymentMethods);
              if (!info.skip && info.date === date) {
                delta -= (c.amount || 0);
                events.push({ label: `${p.name}｜${c.groupLabel}｜${c.label || c.type}`, amount: -(c.amount || 0) });
              }
            });
          });

          running += delta;
          days.push({
            date,
            label: fmtShort(date),
            balance: Math.round(running),
            events,
          });
        }

        let minPoint = days[0] || { balance: 0, date: TODAY };
        days.forEach((d) => {
          if (d.balance < minPoint.balance) minPoint = d;
        });
        const firstShortfall = days.find((d) => d.balance < 0);
        return { days, minPoint, firstShortfall };
      }, [company, projects]);
    }

        const idx = items.findIndex((it) => it.id === id);

        triggerUndo(`「${item.name}」を削除しました`, () => {
          const restored = [...remaining];
          restored.splice(Math.min(idx, restored.length), 0, item);
          onChange(restored);

    function ToolsListCard({ project }) {
      const [copied, setCopied] = useState(false);
      const groups = [];
      (project.categories || []).forEach((cat) => {
        (cat.lineItems || []).forEach((li) => {
          const tools = li.tools || [];
          if (tools.length > 0) groups.push({ itemName: li.name, tools: tools.map((t) => t.name) });
        });
      });
      if (groups.length === 0) return null;
      const text = [`【持参工具リスト】${project.name}`, ...groups.map((g) => `・${g.itemName}：${g.tools.join("、")}`)].join("\n");
      const copy = async () => {
        try {
          await navigator.clipboard.writeText(text);
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        } catch {}
      };
      return (
        <div className="rounded-xl p-4 sm:p-5" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
          <div className="flex items-start justify-between gap-3 mb-3">

            </div>
            <button onClick={copy} className="text-xs font-bold px-3 py-1.5 rounded-md shrink-0" style={{ background: copied ? C.safeSoft : C.ink, color: copied ? C.safe : C.surface }}>
              {copied ? "コピーしました" : "LINE用にコピー"}

          </div>
          <div className="rounded-lg p-3 text-xs whitespace-pre-wrap" style={{ background: C.surfaceAlt, color: C.ink }}>{text}</div>
        </div>
      );
    }

    function QuoteTab({ project, updateProject, paymentMethods, laborRates, materials }) {
      const revenue = projectRevenue(project, laborRates);
      const budget = projectBudget(project, laborRates);
      const actual = projectActual(project);
      const estMargin = revenue > 0 ? (revenue - budget) / revenue : 0;
      const actMargin = revenue > 0 ? (revenue - actual) / revenue : 0;
      const cats = (project.categories || []).map((cat) => categoryStats(cat, laborRates));
      const dangerCount = cats.filter((s) => s.status === "danger").length;
      const amberCount = cats.filter((s) => s.status === "amber").length;
      const triggerUndo = useUndoTrigger();

      const updateCategory = (catId, newCat) => updateProject({ categories: project.categories.map((c) => (c.id === catId ? newCat : c)) });
      const removeCategory = (catId) => {
        const idx = project.categories.findIndex((c) => c.id === catId);
        const item = project.categories[idx];
        if (!item) return;
        const remaining = project.categories.filter((c) => c.id !== catId);
        updateProject({ categories: remaining });
        triggerUndo(`工事項目「${item.name}」を削除しました`, () => {
          const restored = [...remaining];
          restored.splice(Math.min(idx, restored.length), 0, item);
          updateProject({ categories: restored });
        });
      };
      const addCategory = () =>
        updateProject({ categories: [...(project.categories || []), { id: uid(), name: "新規項目", isOverheadCategory: false, lineItems: [], actualCosts: [] }] });

      return (
        <div className="flex flex-col gap-4">
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 sm:gap-3">
            <HeroBox label="お客様見積合計" value={fmtYen(revenue)} />
            <HeroBox label="想定原価合計" value={fmtYen(budget)} />
            <HeroBox label="実績原価合計" value={fmtYen(actual)} color={actual > budget ? C.danger : C.safe} />
            <HeroBox label="想定利益率 → 実績利益率" value={`${fmtPct(estMargin)} → ${fmtPct(actMargin)}`} color={actMargin < estMargin ? C.danger : C.safe} />

          <ToolsListCard project={project} />
          <div className="flex flex-col gap-3">
            {(project.categories || []).map((cat, i) => (
              <CategoryCard key={cat.id} cat={cat} defaultOpen={i === 0 || cat.name.includes("照明")} onChange={(v) => updateCategory(cat.id, v)} onRemove={() => removeCategory(cat.id)} paymentMethods={paymentMethods} laborRates={laborRates} materials={materials} />

          </div>
          <button onClick={addCategory} className="flex items-center justify-center gap-1.5 text-sm font-bold py-2.5 rounded-xl" style={{ background: C.surfaceAlt, color: C.ink, border: `1px dashed ${C.border}` }}>
            <Plus size={15} /> 工事項目（分類）を追加

          <SuppliesToolsCard project={project} updateProject={updateProject} paymentMethods={paymentMethods} laborRates={laborRates} />
        </div>
      );

    function PaymentRow({ p, onChange, onRemove }) {
      return (
        <div className="flex gap-1.5 items-center">
          <Cell small type="date" value={p.date} onChange={(e) => onChange({ ...p, date: e.target.value })} style={{ flex: 1.3, minWidth: 110 }} />
          <Cell small value={p.note} onChange={(e) => onChange({ ...p, note: e.target.value })} style={{ flex: 2.5 }} placeholder="メモ" />
          <Cell small type="number" value={p.amount} onChange={(e) => onChange({ ...p, amount: Number(e.target.value) })} style={{ flex: 1.4, minWidth: 90 }} placeholder="金額" />
          <IconButton onClick={onRemove} title="削除" danger><Trash2 size={13} /></IconButton>
        </div>
      );
    }

    function MilestoneCard({ m, totalQuote, onChange, onRemove }) {
      const triggerUndo = useUndoTrigger();
      const stats = milestoneStats(totalQuote, m);
      const meta = milestoneStatusMeta[stats.status];
      const updatePayment = (id, patch) => onChange({ ...m, payments: m.payments.map((p) => (p.id === id ? patch : p)) });
      const addPayment = () => onChange({ ...m, payments: [...(m.payments || []), { id: uid(), date: TODAY, amount: 0, note: "" }] });
      const removePayment = (id) => {
        const idx = m.payments.findIndex((p) => p.id === id);
        const item = m.payments[idx];
        if (!item) return;
        const remaining = m.payments.filter((p) => p.id !== id);
        onChange({ ...m, payments: remaining });
        triggerUndo(`入金記録「${item.note || fmtYen(item.amount)}」を削除しました`, () => {
          const restored = [...remaining];
          restored.splice(Math.min(idx, restored.length), 0, item);
          onChange({ ...m, payments: restored });
        });
      };
      const barPct = stats.amount > 0 ? Math.min((stats.paid / stats.amount) * 100, 100) : 0;

      return (
        <div className="rounded-xl p-3 sm:p-4" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
          <div className="flex gap-2 items-end flex-wrap mb-2">
            <Field label="名称"><Cell value={m.label} onChange={(e) => onChange({ ...m, label: e.target.value })} style={{ maxWidth: 140, fontWeight: 700 }} /></Field>
            <Field label="割合（%）"><Cell type="number" value={m.percent} onChange={(e) => onChange({ ...m, percent: Number(e.target.value) })} style={{ maxWidth: 90 }} /></Field>
            <Field label="支払期日"><Cell type="date" value={m.dueDate} onChange={(e) => onChange({ ...m, dueDate: e.target.value })} style={{ maxWidth: 160 }} /></Field>
            <span className="text-[11px] font-bold px-2 py-1 rounded-full" style={{ background: meta.bg, color: meta.color }}>
              {meta.label}{stats.overdue && "（期日超過）"}
            </span>
            <IconButton onClick={onRemove} title="削除" danger><Trash2 size={15} /></IconButton>
          </div>
          <div className="h-1.5 rounded-full w-full overflow-hidden mb-2" style={{ background: C.surfaceAlt }}>
            <div className="h-full rounded-full" style={{ width: `${barPct}%`, background: meta.color }} />
          </div>
          <div className="grid grid-cols-3 gap-2 mb-3">
            <StatBox label="予定金額" value={fmtYen(stats.amount)} />
            <StatBox label="入金済み" value={fmtYen(stats.paid)} color={C.safe} />
            <StatBox label="残額" value={fmtYen(stats.remaining)} color={stats.remaining > 0 ? C.danger : C.safe} />
          </div>
          <div className="flex items-center justify-between mb-1">
            <span className="text-xs font-bold" style={{ color: C.inkSoft }}>入金履歴</span>
            <button onClick={addPayment} className="text-xs flex items-center gap-0.5" style={{ color: C.inkSoft }}><Plus size={12} /> 入金を記録</button>
          </div>
          <div className="flex flex-col gap-1">
            {(m.payments || []).map((p) => (
              <PaymentRow key={p.id} p={p} onChange={(v) => updatePayment(p.id, v)} onRemove={() => removePayment(p.id)} />
            ))}
          </div>
        </div>
      );
    }

    function PaymentTab({ project, updateProject, laborRates }) {
      const triggerUndo = useUndoTrigger();
      const totalQuote = projectRevenue(project, laborRates);
      const stats = (project.milestones || []).map((m) => milestoneStats(totalQuote, m));
      const paidTotal = sum(stats, (s) => s.paid);
      const remainingTotal = sum(stats, (s) => s.remaining);
      const percentSum = sum(project.milestones || [], (m) => m.percent);

      const updateMilestone = (id, v) => updateProject({ milestones: project.milestones.map((m) => (m.id === id ? v : m)) });
      const removeMilestone = (id) => {
        const idx = project.milestones.findIndex((m) => m.id === id);
        const item = project.milestones[idx];
        if (!item) return;
        const remaining = project.milestones.filter((m) => m.id !== id);
        updateProject({ milestones: remaining });
        triggerUndo(`支払い区分「${item.label}」を削除しました`, () => {
          const restored = [...remaining];
          restored.splice(Math.min(idx, restored.length), 0, item);
          updateProject({ milestones: restored });
        });
      };
      const addMilestone = () =>
        updateProject({ milestones: [...(project.milestones || []), { id: uid(), label: "追加入金", percent: 0, dueDate: TODAY, payments: [] }] });

      return (
        <div className="flex flex-col gap-4">
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 sm:gap-3">
            <HeroBox label="総工費（見積と連動）" value={fmtYen(totalQuote)} />
            <HeroBox label="入金済み合計" value={fmtYen(paidTotal)} color={C.safe} />
            <HeroBox label="未収合計" value={fmtYen(remainingTotal)} color={remainingTotal > 0 ? C.danger : C.safe} />
            <HeroBox label="按分割合" value={`${percentSum}%`} sub={percentSum !== 100 ? "100%に調整してください" : "OK"} color={percentSum !== 100 ? C.amber : C.safe} />
          </div>
          <div className="flex flex-col gap-3">
            {(project.milestones || []).map((m) => (
              <MilestoneCard key={m.id} m={m} totalQuote={totalQuote} onChange={(v) => updateMilestone(m.id, v)} onRemove={() => removeMilestone(m.id)} />
            ))}
          </div>
          <button onClick={addMilestone} className="flex items-center justify-center gap-1.5 text-sm font-bold py-2.5 rounded-xl" style={{ background: C.surfaceAlt, color: C.ink, border: `1px dashed ${C.border}` }}>
            <Plus size={15} /> 支払い区分を追加
          </button>
        </div>
      );
    }

    function FixedCostRow({ f, onChange, onRemove }) {
      const triggerUndo = useUndoTrigger();
      const [open, setOpen] = useState(false);
      const payments = f.payments || [];
      const paidThisMonth = payments.some((p) => p.date && p.date.slice(0, 7) === TODAY.slice(0, 7));
      const active = f.active !== false;

      const addPayment = () => onChange({ ...f, payments: [...payments, { id: uid(), date: TODAY, amount: f.amount, note: "" }] });
      const updatePayment = (id, patch) => onChange({ ...f, payments: payments.map((p) => (p.id === id ? { ...p, ...patch } : p)) });
      const removePayment = (id) => {
        const idx = payments.findIndex((p) => p.id === id);
        const item = payments[idx];
        if (!item) return;
        const remaining = payments.filter((p) => p.id !== id);
        onChange({ ...f, payments: remaining });
        triggerUndo(`支払い履歴「${fmtShort(item.date)}」を削除しました`, () => {
          const restored = [...remaining];
          restored.splice(Math.min(idx, restored.length), 0, item);
          onChange({ ...f, payments: restored });
        });
      };

      return (
        <div className="rounded-lg p-2" style={{ background: C.surfaceAlt, opacity: !active ? 0.5 : paidThisMonth ? 0.65 : 1 }}>
          <div className="flex gap-2 items-end flex-wrap">
            <button onClick={() => onChange({ ...f, active: !active })} className="flex items-center gap-1 text-xs font-bold px-2 py-1.5 rounded-full shrink-0" style={{ background: active ? C.safeSoft : C.dangerSoft, color: active ? C.safe : C.danger }}>
              {active ? <Power size={12} /> : <PowerOff size={12} />} {active ? "計上中" : "対象外"}
            </button>
            <Field label="項目名" grow><Cell value={f.name} onChange={(e) => onChange({ ...f, name: e.target.value })} style={{ minWidth: 160 }} /></Field>
            <Field label="金額（円）"><Cell type="number" value={f.amount} onChange={(e) => onChange({ ...f, amount: Number(e.target.value) })} /></Field>
            <Field label="支払日">
              <div className="flex items-center gap-1">
                <Cell type="number" min={0} max={31} value={f.day} onChange={(e) => onChange({ ...f, day: Number(e.target.value) })} style={{ width: 70 }} />
                <button onClick={() => onChange({ ...f, day: 0 })} className="text-[11px] font-bold px-2 py-1.5 rounded-md shrink-0" style={{ background: Number(f.day) === 0 ? C.ink : C.surfaceAlt, color: Number(f.day) === 0 ? C.surface : C.inkSoft }}>末日</button>
              </div>
            </Field>
            <button onClick={() => setOpen((o) => !o)} className="text-[11px] font-bold px-2 py-1.5 rounded-md shrink-0" style={{ background: C.surface, color: C.inkSoft, border: `1px solid ${C.border}` }}>
              消込 {payments.length > 0 && `(${payments.length})`}
            </button>
            <IconButton onClick={onRemove} title="削除" danger><Trash2 size={16} /></IconButton>
          </div>
          {open && (
            <div className="mt-2 pt-2" style={{ borderTop: `1px dashed ${C.border}` }}>
              <div className="flex items-center gap-2 flex-wrap mb-2">
                <span className="text-xs font-bold shrink-0" style={{ color: C.inkSoft }}>今月だけ延期</span>
                <Cell type="date" value={f.overrideDate || ""} onChange={(e) => onChange({ ...f, overrideDate: e.target.value })} style={{ width: 150 }} small />
                {f.overrideDate && <button onClick={() => onChange({ ...f, overrideDate: "" })} className="text-[11px] font-bold px-2 py-1 rounded-md" style={{ background: C.surface, color: C.inkSoft, border: `1px solid ${C.border}` }}>解除</button>}
              </div>
              <div className="flex items-center justify-between mb-1">
                <span className="text-xs font-bold" style={{ color: C.inkSoft }}>消込履歴</span>
                <button onClick={addPayment} className="text-xs flex items-center gap-0.5" style={{ color: C.inkSoft }}><Plus size={12} /> 今月の支払いを記録</button>
              </div>
              <div className="flex flex-col gap-1">
                {payments.map((p) => (
                  <div key={p.id} className="flex gap-1.5 items-center">
                    <Cell small type="date" value={p.date} onChange={(e) => updatePayment(p.id, { date: e.target.value })} style={{ flex: 1.2, minWidth: 105 }} />
                    <Cell small type="number" value={p.amount} onChange={(e) => updatePayment(p.id, { amount: Number(e.target.value) })} style={{ flex: 1, minWidth: 90 }} placeholder="実額" />
                    <Cell small value={p.note} onChange={(e) => updatePayment(p.id, { note: e.target.value })} style={{ flex: 1.5 }} placeholder="メモ" />
                    <IconButton onClick={() => removePayment(p.id)} title="削除" danger><Trash2 size={13} /></IconButton>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    const PERSONAL_LEDGER_CATEGORIES = ["食費", "娯楽費", "日用品", "交通費", "材料費（会社用）", "その他"];
    function PersonalLedgerCard({ company, updateCompany }) {
      const triggerUndo = useUndoTrigger();
      const ledger = company.personalLedger || [];
      const [open, setOpen] = useState(false);
      const thisMonthKey = TODAY.slice(0, 7);

      const add = () =>
        updateCompany({ personalLedger: [...ledger, { id: uid(), date: TODAY, direction: "company_to_personal", category: "食費", amount: 0, note: "" }] });
      const update = (id, patch) => updateCompany({ personalLedger: ledger.map((l) => (l.id === id ? { ...l, ...patch } : l)) });
      const remove = (id) => {
        const idx = ledger.findIndex((l) => l.id === id);
        const item = ledger[idx];
        if (!item) return;
        const remaining = ledger.filter((l) => l.id !== id);
        updateCompany({ personalLedger: remaining });
        triggerUndo(`精算記録を削除しました`, () => {
          const restored = [...remaining];
          restored.splice(Math.min(idx, restored.length), 0, item);
          updateCompany({ personalLedger: restored });
        });
      };

      const netBalance = sum(ledger.filter((l) => l.direction === "personal_to_company"), (l) => l.amount) - sum(ledger.filter((l) => l.direction === "company_to_personal"), (l) => l.amount);
      const thisMonth = ledger.filter((l) => l.date && l.date.slice(0, 7) === thisMonthKey);
      const categoryTotals = PERSONAL_LEDGER_CATEGORIES.map((cat) => ({
        category: cat,
        total: sum(thisMonth.filter((l) => l.category === cat), (l) => l.amount),
      })).filter((c) => c.total > 0);

      return (
        <SectionCard title="個人⇄会社 精算" subtitle="「何のために払ったか」を記録して精算残高と月間合計を可視化" right={<IconButton onClick={add} title="追加"><Plus size={16} /></IconButton>}>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 mb-3">
            <StatBox label={netBalance >= 0 ? "会社→あき（返済要）" : "あき→会社（返済要）"} value={fmtYen(Math.abs(netBalance))} color={netBalance === 0 ? C.inkSoft : netBalance > 0 ? C.danger : C.safe} />
            <div className="rounded-lg px-2.5 py-2" style={{ background: C.surfaceAlt }}>
              <div className="text-[10px] mb-1" style={{ color: C.inkSoft }}>今月のカテゴリ別合計（{thisMonthKey}）</div>
              {categoryTotals.map((c) => (
                <div key={c.category} className="flex justify-between text-xs">
                  <span style={{ color: C.inkSoft }}>{c.category}</span>
                  <span className="mono font-bold" style={{ color: C.ink }}>{fmtYen(c.total)}</span>
                </div>
              ))}
            </div>
          </div>
          <button onClick={() => setOpen((o) => !o)} className="text-xs font-bold flex items-center gap-1" style={{ color: C.inkSoft }}>
            {open ? <ChevronDown size={13} /> : <ChevronRight size={13} />} 記録一覧（{ledger.length}件）
          </button>
          {open && (
            <div className="flex flex-col gap-1.5 mt-2">
              {ledger.map((l) => (
                <div key={l.id} className="flex flex-col gap-1 p-1.5 rounded-md" style={{ background: C.surfaceAlt }}>
                  <div className="flex gap-1.5 items-center flex-wrap">
                    <Cell small type="date" value={l.date} onChange={(e) => update(l.id, { date: e.target.value })} style={{ flex: 1.2, minWidth: 105 }} />
                    <select value={l.category} onChange={(e) => update(l.id, { category: e.target.value })} className="rounded-md px-1.5 py-1 text-[11px] outline-none" style={inputStyle}>
                      {PERSONAL_LEDGER_CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}
                    </select>
                    <Cell small type="number" value={l.amount} onChange={(e) => update(l.id, { amount: Number(e.target.value) })} style={{ flex: 1, minWidth: 80 }} />
                    <IconButton onClick={() => remove(l.id)} title="削除" danger><Trash2 size={13} /></IconButton>
                  </div>
                  <div className="flex gap-1.5 items-center flex-wrap pl-1">
                    <button
                      onClick={() => update(l.id, { direction: l.direction === "company_to_personal" ? "personal_to_company" : "company_to_personal" })}
                      className="text-[10px] font-bold px-2 py-1 rounded-full shrink-0"
                      style={{ background: l.direction === "company_to_personal" ? C.dangerSoft : C.safeSoft, color: l.direction === "company_to_personal" ? C.danger : C.safe }}
                    >
                      {l.direction === "company_to_personal" ? "会社のお金→個人利用" : "個人のお金→会社用途"}
                    </button>
                    <Cell small value={l.note} onChange={(e) => update(l.id, { note: e.target.value })} style={{ flex: 1 }} placeholder="メモ" />
                  </div>
                </div>
              ))}
            </div>
          )}
        </SectionCard>
      );
    }

                      <span>原価消化 {fmtPct(stats.ratio)}（{fmtYen(stats.actual)} / {fmtYen(stats.budget)}）</span>

                    </div>

            <div className="flex flex-col gap-3">

                      <Field label="借入額（円）"><Cell type="number" value={loan.amount} onChange={(e) => updateCompany({ loans: company.loans.map(l => l.id === loan.id ? { ...l, amount: Number(e.target.value) } : l) })} style={{ width: 120 }} /></Field>
                      <Field label="返済期日"><Cell type="date" value={loan.dueDate} onChange={(e) => updateCompany({ loans: company.loans.map(l => l.id === loan.id ? { ...l, dueDate: e.target.value } : l) })} style={{ width: 150 }} /></Field>

    function AnalyticsTab({ projects, laborRates }) {

            <div className="flex flex-col gap-2">

    const WEEKDAY_LABELS = ["月", "火", "水", "木", "金", "土", "日"];

    function CalendarTab({ company, updateCompany, projects }) {
      const [viewDate, setViewDate] = useState(() => new Date());
      const year = viewDate.getFullYear();
      const month = viewDate.getMonth();
      const monthKey = `${year}-${String(month + 1).padStart(2, "0")}`;
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const firstWeekday = (new Date(year, month, 1).getDay() + 6) % 7;
      const dateStr = (d) => fmtDateLocal(new Date(year, month, d));

      const eventsByDate = useMemo(() => {
        const map = {};
        const push = (date, ev) => {
          if (!date || date.slice(0, 7) !== monthKey) return;
          (map[date] = map[date] || []).push(ev);
        };

        (company.fixedCosts || []).filter((fc) => fc.active !== false).forEach((fc) => {
          if (fc.overrideDate && fc.overrideDate.slice(0, 7) === monthKey) {
            push(fc.overrideDate, { label: `${fc.name}（延期）`, color: C.danger });
          } else if (Number(fc.day) === 0) {
            push(dateStr(daysInMonth), { label: fc.name, color: C.danger });
          } else if (fc.day >= 1 && fc.day <= daysInMonth) {
            push(dateStr(fc.day), { label: fc.name, color: C.danger });
          }
        });
        (company.loans || []).filter((l) => l.active).forEach((l) => push(addDays(l.dueDate, Number(l.delayDays) || 0), { label: `${l.person} 返済`, color: C.danger }));

        (projects || []).forEach((p) => {
          const totalQuote = projectRevenue(p, company.laborRates);
          (p.milestones || []).forEach((m) => {
            const ms = milestoneStats(totalQuote, m);
            if (ms.remaining > 0) push(m.dueDate, { label: `${p.name}｜${m.label} 入金`, color: C.safe });
          });
          if (p.startDate) push(p.startDate, { label: `${p.name}｜着工`, color: C.inkSoft });
          if (p.expectedEndDate) push(p.expectedEndDate, { label: `${p.name}｜完了予定`, color: C.inkSoft });
        });

        (company.scheduleEvents || []).forEach((ev) => {
          const proj = (projects || []).find((p) => p.id === ev.projectId);
          const idx = proj ? projects.indexOf(proj) % PROJECT_COLORS.length : 0;
          const color = ev.type === "meeting" ? C.amber : PROJECT_COLORS[idx];
          const label = ev.type === "meeting" ? `${ev.time ? ev.time + " " : ""}${ev.title || "打ち合わせ"}` : `${EVENT_TYPE_LABEL[ev.type]}${proj ? "：" + proj.name : ""}${ev.title ? " " + ev.title : ""}`;
          push(ev.date, { label, color, evId: ev.id });
        });

        return map;
      }, [company, projects, monthKey, daysInMonth]);

      const cells = [];
      for (let i = 0; i < firstWeekday; i++) cells.push(null);
      for (let d = 1; d <= daysInMonth; d++) cells.push(d);

      const [form, setForm] = useState({ date: TODAY, type: "workday", projectId: projects[0]?.id || "", time: "", title: "" });
      const addEvent = () => {
        if (!form.date) return;
        updateCompany({ scheduleEvents: [...(company.scheduleEvents || []), { id: uid(), ...form }] });
      };

      return (
        <div className="flex flex-col gap-4">
          <div className="flex items-center justify-between">
            <IconButton onClick={() => setViewDate(new Date(year, month - 1, 1))} title="前月"><ChevronLeft size={16} /></IconButton>
            <span className="text-base font-bold" style={{ color: C.ink, fontFamily: "'Zen Kaku Gothic New', sans-serif" }}>{year}年{month + 1}月</span>
            <IconButton onClick={() => setViewDate(new Date(year, month + 1, 1))} title="翌月"><ChevronRight size={16} /></IconButton>
          </div>

          <div className="rounded-xl p-3 sm:p-4" style={{ background: C.surface, border: `1px solid ${C.border}` }}>
            <div className="grid grid-cols-7 gap-1 mb-1">
              {WEEKDAY_LABELS.map((w) => <div key={w} className="text-center text-[11px]" style={{ color: C.inkSoft }}>{w}</div>)}
            </div>
            <div className="grid grid-cols-7 gap-1">
              {cells.map((d, i) => {
                if (d === null) return <div key={i} />;
                const ds = dateStr(d);
                const isToday = ds === TODAY;
                const dayEvents = eventsByDate[ds] || [];
                return (
                  <div key={i} className="rounded-md p-1 flex flex-col gap-0.5" style={{ minHeight: 64, background: C.surfaceAlt, border: isToday ? `2px solid ${C.amber}` : `1px solid ${C.border}` }}>
                    <span className="text-[11px]" style={{ color: isToday ? C.amber : C.inkSoft, fontWeight: isToday ? 700 : 400 }}>{d}</span>
                    {dayEvents.slice(0, 3).map((ev, j) => (
                      <span key={j} className="text-[9px] rounded px-1 truncate" style={{ background: `${ev.color}22`, color: ev.color }}>{ev.label}</span>
                    ))}
                  </div>
                );
              })}
            </div>
          </div>

          <SectionCard title="予定を追加" subtitle="作業日・打ち合わせ・出張の登録">
            <div className="flex gap-2 items-end flex-wrap">
              <Field label="日付"><Cell type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} style={{ maxWidth: 160 }} /></Field>
              <Field label="種別">
                <select value={form.type} onChange={(e) => setForm({ ...form, type: e.target.value })} className="rounded-md px-2 py-1.5 text-sm outline-none" style={inputStyle}>
                  {Object.entries(EVENT_TYPE_LABEL).map(([k, v]) => <option key={k} value={k}>{v}</option>)}
                </select>
              </Field>
              <Field label="メモ" grow><Cell value={form.title} onChange={(e) => setForm({ ...form, title: e.target.value })} style={{ minWidth: 160 }} placeholder="内容" /></Field>
              <button onClick={addEvent} className="flex items-center gap-1 text-xs font-bold px-3 py-2 rounded-md shrink-0" style={{ background: C.ink, color: C.surface }}><Plus size={13} /> 追加</button>
            </div>
          </SectionCard>
        </div>
      );
    }

    function MaterialMasterRow({ m, onChange, onRemove }) {
      const triggerUndo = useUndoTrigger();
      const [open, setOpen] = useState(false);
      const priceLog = m.priceLog || [];
      const sortedLog = [...priceLog].sort((a, b) => (a.date > b.date ? -1 : 1));
      const lastLog = sortedLog[0];
      const prevLog = sortedLog[1];

      const addLog = () => onChange({ ...m, priceLog: [...priceLog, { id: uid(), date: TODAY, price: m.unitPrice || 0, source: "コーナン", note: "" }] });
      const updateLog = (id, patch) => onChange({ ...m, priceLog: priceLog.map((l) => (l.id === id ? { ...l, ...patch } : l)) });
      const removeLog = (id) => onChange({ ...m, priceLog: priceLog.filter((l) => l.id !== id) });

      return (
        <div className="rounded-lg p-2.5" style={{ background: C.surfaceAlt }}>
          <div className="flex gap-2 items-end flex-wrap">
            <Field label="品名" grow><Cell value={m.name} onChange={(e) => onChange({ ...m, name: e.target.value })} style={{ minWidth: 160, fontWeight: 700 }} /></Field>
            <Field label="単位"><Cell value={m.unit} onChange={(e) => onChange({ ...m, unit: e.target.value })} style={{ width: 60 }} /></Field>
            <Field label="現在の単価（円）"><Cell type="number" value={m.unitPrice} onChange={(e) => onChange({ ...m, unitPrice: Number(e.target.value) })} style={{ width: 100 }} /></Field>
            <button onClick={() => setOpen((o) => !o)} className="text-[11px] font-bold px-2 py-1.5 rounded-md shrink-0" style={{ background: C.surface, color: C.inkSoft, border: `1px solid ${C.border}` }}>
              購入履歴 {priceLog.length > 0 && `(${priceLog.length})`}
            </button>
            <IconButton onClick={onRemove} title="削除" danger><Trash2 size={16} /></IconButton>
          </div>

          {!open && lastLog && (
            <div className="text-[11px] mt-2 flex items-center gap-2 flex-wrap" style={{ color: C.inkSoft }}>
              <span>直近の購入：{fmtShort(lastLog.date)}・{fmtYen(lastLog.price)}{lastLog.source && `（${lastLog.source}）`}</span>
              {prevLog && (
                (() => {
                  const diff = lastLog.price - prevLog.price;
                  if (diff > 0) return <span className="font-bold px-1.5 py-0.5 rounded" style={{ background: C.dangerSoft, color: C.danger }}>↑ {diff.toLocaleString()}円 値上がり</span>;
                  if (diff < 0) return <span className="font-bold px-1.5 py-0.5 rounded" style={{ background: C.safeSoft, color: C.safe }}>↓ {Math.abs(diff).toLocaleString()}円 値下がり</span>;
                  return <span style={{ color: C.inkSoft }}>→ 価格維持</span>;
                })()
              )}
            </div>
          )}

          {open && (
            <div className="mt-2 pt-2" style={{ borderTop: `1px dashed ${C.border}` }}>
              <div className="flex items-center justify-between mb-1">
                <span className="text-xs font-bold" style={{ color: C.inkSoft }}>購入履歴（レシートから記録）</span>
                <button onClick={addLog} className="text-xs flex items-center gap-0.5" style={{ color: C.inkSoft }}><Plus size={12} /> 記録を追加</button>
              </div>
              <div className="flex flex-col gap-1">
                {sortedLog.map((l) => (
                  <div key={l.id} className="flex gap-1.5 items-center flex-wrap">
                    <Cell small type="date" value={l.date} onChange={(e) => updateLog(l.id, { date: e.target.value })} style={{ flex: 1.2, minWidth: 105 }} />
                    <Cell small type="number" value={l.price} onChange={(e) => updateLog(l.id, { price: Number(e.target.value) })} style={{ flex: 1, minWidth: 80 }} placeholder="単価" />
                    <select value={l.source} onChange={(e) => updateLog(l.id, { source: e.target.value })} className="rounded-md px-1.5 py-1 text-[11px] outline-none" style={{ ...inputStyle, flex: 1.3, minWidth: 110 }}>
                      <option value="">購入先</option>
                      {SOURCES.map((s) => <option key={s} value={s}>{s}</option>)}
                    </select>
                    <button onClick={() => onChange({ ...m, unitPrice: l.price })} className="text-[10px] font-bold px-2 py-1.5 rounded-md shrink-0" style={{ background: m.unitPrice === l.price ? C.safeSoft : C.surface, color: m.unitPrice === l.price ? C.safe : C.inkSoft, border: `1px solid ${C.border}` }}>
                      {m.unitPrice === l.price ? "✓ 単価に反映中" : "単価に反映"}
                    </button>
                    <IconButton onClick={() => removeLog(l.id)} title="削除" danger><Trash2 size={13} /></IconButton>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    function PaymentMethodCard({ method, projects, onChange, onRemove }) {
      const balance = method.type === "charge" ? chargeBalance(method, projects) : null;
      const addTopUp = () => onChange({ ...method, topUps: [...(method.topUps || []), { id: uid(), date: TODAY, amount: 0, note: "" }] });
      const updateTopUp = (id, patch) => onChange({ ...method, topUps: (method.topUps || []).map((t) => (t.id === id ? { ...t, ...patch } : t)) });
      const removeTopUp = (id) => onChange({ ...method, topUps: (method.topUps || []).filter((t) => t.id !== id) });

      return (
        <div className="rounded-lg p-3" style={{ background: C.surfaceAlt, border: `1px dashed ${C.border}` }}>
          <div className="flex gap-2 items-end flex-wrap mb-2">
            <Field label="名称" grow><Cell value={method.name} onChange={(e) => onChange({ ...method, name: e.target.value })} style={{ maxWidth: 200, minWidth: 140, fontWeight: 700 }} /></Field>
            <Field label="種別">
              <select value={method.type} onChange={(e) => onChange({ ...method, type: e.target.value })} className="rounded-md px-2 py-1.5 text-sm outline-none" style={inputStyle}>

              </select>
            </Field>
            {method.type === "credit" && (

                <Field label="締め日"><Cell type="number" min={1} max={31} value={method.closingDay || 31} onChange={(e) => onChange({ ...method, closingDay: Number(e.target.value) })} style={{ maxWidth: 80 }} /></Field>
                <Field label="支払日"><Cell type="number" min={1} max={31} value={method.paymentDay || 27} onChange={(e) => onChange({ ...method, paymentDay: Number(e.target.value) })} style={{ maxWidth: 80 }} /></Field>
                <Field label="支払月"><Cell type="number" min={0} max={2} value={method.paymentMonthOffset ?? 1} onChange={(e) => onChange({ ...method, paymentMonthOffset: Number(e.target.value) })} style={{ maxWidth: 80 }} /></Field>
                <Field label="枠"><Cell type="number" value={method.creditLimit || 0} onChange={(e) => onChange({ ...method, creditLimit: Number(e.target.value) })} style={{ maxWidth: 110 }} /></Field>
              </>
            )}
            <IconButton onClick={onRemove} title="削除" danger><Trash2 size={16} /></IconButton>
          </div>
          {method.type === "charge" && (
            <div className="mt-1">
              <div className="flex items-center justify-between mb-1">
                <span className="text-xs font-bold" style={{ color: C.inkSoft }}>チャージ残高：<b className="mono" style={{ color: balance < 0 ? C.danger : C.safe }}>{fmtYen(balance)}</b></span>
                <button onClick={addTopUp} className="text-xs flex items-center gap-0.5" style={{ color: C.inkSoft }}><Plus size={12} /> チャージ追加</button>
              </div>
              <div className="flex flex-col gap-1 mb-1">
                {(method.topUps || []).map((t) => (
                  <div key={t.id} className="flex gap-1.5 items-center">
                    <Cell small type="date" value={t.date} onChange={(e) => updateTopUp(t.id, { date: e.target.value })} style={{ flex: 1.3, minWidth: 105 }} />
                    <Cell small value={t.note} onChange={(e) => updateTopUp(t.id, { note: e.target.value })} style={{ flex: 2 }} placeholder="メモ" />
                    <Cell small type="number" value={t.amount} onChange={(e) => updateTopUp(t.id, { amount: Number(e.target.value) })} style={{ flex: 1.2, minWidth: 80 }} />
                    <IconButton onClick={() => removeTopUp(t.id)} title="削除" danger><Trash2 size={12} /></IconButton>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    // ----------------------------------------------------
    const TABS = [
      { id: "quote", label: "見積・原価", icon: FileText },
      { id: "payment", label: "支払いスケジュール", icon: Receipt },
      { id: "cashflow", label: "資金繰りシミュレーター", icon: Activity },
      { id: "analytics", label: "実績分析", icon: BarChart3 },
      { id: "calendar", label: "カレンダー", icon: Calendar },
      { id: "settings", label: "設定", icon: Settings },
    ];

    function TabNav({ active, onChange }) {
      return (
        <div className="flex gap-1 p-1 rounded-xl" style={{ background: C.surfaceAlt, border: `1px solid ${C.border}` }}>
          {TABS.map((t) => {
            const Icon = t.icon;
            const isActive = t.id === active;
            return (
              <button
                key={t.id}
                onClick={() => onChange(t.id)}
                className="flex-1 flex items-center justify-center gap-1.5 text-xs sm:text-sm font-bold py-2 rounded-lg transition-colors"
                style={{ background: isActive ? C.ink : "transparent", color: isActive ? C.surface : C.inkSoft }}
              >
                <Icon size={14} />
                <span className="hidden sm:inline">{t.label}</span>
              </button>
            );
          })}
        </div>
      );
    }

    function App() {
      const [loading, setLoading] = useState(true);
      const [saveStatus, setSaveStatus] = useState("idle");
      const [projects, setProjects] = useState([]);
      const [company, setCompany] = useState(emptyCompany);
      const [activeProjectId, setActiveProjectId] = useState(null);
      const [activeTab, setActiveTab] = useState("quote");
      const [healthStorageOk, setHealthStorageOk] = useState(null);
      const [healthIssues, setHealthIssues] = useState([]);
      const [healthOpen, setHealthOpen] = useState(false);
      const [undoInfo, setUndoInfo] = useState(null);
      const hasLoadedRef = useRef(false);
      const undoTimerRef = useRef(null);

      const triggerUndo = useCallback((label, restore) => {
        setUndoInfo({ label, restore });
        clearTimeout(undoTimerRef.current);
        undoTimerRef.current = setTimeout(() => setUndoInfo(null), 8000);
      }, []);

      useEffect(() => {
        let cancelled = false;
        (async () => {
          const data = await loadAllData();
          if (cancelled) return;
          setCompany(data.company);
          setProjects(data.projects);
          setActiveProjectId(data.activeProjectId);
          setLoading(false);
          hasLoadedRef.current = true;

          const storageCheck = await runStorageHealthCheck();
          if (cancelled) return;
          setHealthStorageOk(storageCheck.ok);
          const issues = runDataHealthChecks(data.company, data.projects);
          setHealthIssues(issues);
          if (!storageCheck.ok || issues.length > 0) setHealthOpen(true);
        })();
        return () => { cancelled = true; };
      }, []);

      const saveCompanyNow = useCallback(async (comp) => {
        setSaveStatus("saving");
        const res = await storageSet("company-settings", comp);
        setSaveStatus(res.ok ? "saved" : "error");
        return res.ok;
      }, []);

      const saveProjectsNow = useCallback(async (projs, actId) => {
        setSaveStatus("saving");
        const results = await saveEntriesSequentially([
          ["project-index", { projectIds: projs.map((p) => p.id), activeProjectId: actId }],
          ...projs.map((p) => [`project-${p.id}`, p]),
        ]);
        const ok = results.every(r => r.ok);
        setSaveStatus(ok ? "saved" : "error");
        return ok;
      }, []);

      useEffect(() => {
        if (!hasLoadedRef.current) return;
        const t = setTimeout(() => saveCompanyNow(company), 1200);
        return () => clearTimeout(t);
      }, [company, saveCompanyNow]);

      useEffect(() => {
        if (!hasLoadedRef.current) return;
        const t = setTimeout(() => saveProjectsNow(projects, activeProjectId), 1200);
        return () => clearTimeout(t);
      }, [projects, activeProjectId, saveProjectsNow]);

      const activeProject = (projects || []).find((p) => p.id === activeProjectId) || projects[0];

      const updateCompany = useCallback((patch) => setCompany((c) => ({ ...c, ...patch })), []);
      const updateProjectById = useCallback((id, patch) => {
        setProjects((ps) => ps.map((p) => (p.id === id ? { ...p, ...patch } : p)));
      }, []);
      const updateActiveProject = useCallback((patch) => {
        if (!activeProject) return;
        updateProjectById(activeProject.id, patch);
      }, [activeProject, updateProjectById]);

      const addProject = () => {
        const p = newProjectTemplate();
        setProjects((ps) => [...ps, p]);
        setActiveProjectId(p.id);
      };
      const removeProject = (id) => {
        const idx = projects.findIndex((p) => p.id === id);
        const item = projects[idx];
        if (!item) return;
        storageDelete(`project-${id}`);
        const remaining = projects.filter((p) => p.id !== id);
        setProjects(remaining);
        if (id === activeProjectId) setActiveProjectId(remaining[0]?.id || null);
        triggerUndo(`案件「${item.name}」を削除しました`, () => {
          setProjects((ps) => {
            const restored = [...ps];
            restored.splice(Math.min(idx, restored.length), 0, item);
            return restored;
          });
          setActiveProjectId(item.id);
        });
      };

      if (loading) {
        return (
          <div className="w-full min-h-screen flex items-center justify-center" style={{ background: C.bg }}>
            <span className="flex items-center gap-2 text-sm font-bold" style={{ color: C.inkSoft }}>
              <Loader2 size={16} /> 読み込み中…
            </span>
          </div>
        );
      }

      return (
        <UndoCtx.Provider value={triggerUndo}>
          <div className="w-full min-h-screen pb-20" style={{ background: C.bg }}>
            <div className="max-w-3xl mx-auto px-4 py-6 sm:py-8 flex flex-col gap-5">
              <div>
                <div className="flex items-center justify-between mb-1">
                  <div className="flex items-center gap-2">
                    <div className="w-2.5 h-2.5 rounded-full" style={{ background: C.amber }} />
                    <span className="text-xs tracking-widest font-bold" style={{ color: C.inkSoft }}>PLAYBOOK</span>
                  </div>
                  <span className="flex items-center gap-1 text-[11px] font-bold" style={{ color: saveStatus === "error" ? C.danger : C.safe }}>
                    {saveStatus === "saving" ? <><Loader2 size={11} /> 保存中…</> : saveStatus === "saved" ? <><Save size={11} /> 保存済み</> : saveStatus === "error" ? <><AlertTriangle size={11} /> 保存失敗</> : null}
                  </span>
                </div>
                <h1 className="text-2xl sm:text-3xl font-black tracking-tight" style={{ color: C.ink, fontFamily: "'Zen Kaku Gothic New', sans-serif" }}>
                  Playbook
                </h1>
                <p className="text-sm mt-1" style={{ color: C.inkSoft }}>
                  見積 → 支払い → 発注 → 資金繰り → 予定がひとつにつながった、現場の司令塔。
                </p>
              </div>

              {!["cashflow", "analytics", "calendar", "settings"].includes(activeTab) && (
                <div className="flex items-center gap-2 flex-wrap">
                  {(projects || []).map((p) => (
                    <button
                      key={p.id}
                      onClick={() => setActiveProjectId(p.id)}
                      className="text-xs font-bold px-3 py-1.5 rounded-full flex items-center gap-1.5"
                      style={{
                        background: p.id === activeProject?.id ? C.ink : C.surface,
                        color: p.id === activeProject?.id ? C.surface : C.inkSoft,
                        border: `1px solid ${C.border}`,
                      }}
                    >
                      {p.name}
                    </button>
                  ))}
                  <IconButton onClick={addProject} title="案件を追加"><FolderPlus size={15} /></IconButton>
                </div>
              )}

              {!["cashflow", "analytics", "calendar", "settings"].includes(activeTab) && activeProject && (
                <div className="flex gap-2 items-center flex-wrap">
                  <Pencil size={13} style={{ color: C.inkSoft }} />
                  <Cell value={activeProject.name} onChange={(e) => updateActiveProject({ name: e.target.value })} style={{ maxWidth: 220, fontWeight: 700 }} placeholder="案件名" />
                  <Cell value={activeProject.client} onChange={(e) => updateActiveProject({ client: e.target.value })} style={{ maxWidth: 220 }} placeholder="お客様名" />
                  {projects.length > 1 && (
                    <IconButton onClick={() => removeProject(activeProject.id)} title="この案件を削除" danger><Trash2 size={14} /></IconButton>
                  )}
                </div>
              )}

              <TabNav active={activeTab} onChange={setActiveTab} />

              {activeTab === "quote" && activeProject && (
                <QuoteTab project={activeProject} updateProject={updateActiveProject} paymentMethods={company.paymentMethods} laborRates={company.laborRates} materials={company.materials || []} />
              )}
              {activeTab === "payment" && activeProject && (
                <PaymentTab project={activeProject} updateProject={updateActiveProject} laborRates={company.laborRates} />
              )}
              {activeTab === "cashflow" && (
                <CashflowTab company={company} updateCompany={updateCompany} projects={projects} updateProjectById={updateProjectById} />
              )}
              {activeTab === "analytics" && (
                <AnalyticsTab projects={projects} laborRates={company.laborRates} />
              )}
              {activeTab === "calendar" && (
                <CalendarTab company={company} updateCompany={updateCompany} projects={projects} />
              )}
              {activeTab === "settings" && (
                <SettingsTab company={company} updateCompany={updateCompany} projects={projects} />
              )}
            </div>

            {undoInfo && (
              <div
                className="fixed left-1/2 bottom-6 flex items-center gap-3 px-4 py-2.5 rounded-xl shadow-lg"
                style={{ background: C.ink, color: C.surface, transform: "translateX(-50%)", zIndex: 50 }}
              >
                <span className="text-sm">{undoInfo.label}</span>
                <button
                  onClick={() => {
                    undoInfo.restore();
                    setUndoInfo(null);
                  }}
                  className="flex items-center gap-1 text-sm font-bold"
                  style={{ color: C.amber }}
                >
                  <Undo2 size={14} /> 元に戻す
                </button>
              </div>
            )}
          </div>
        </UndoCtx.Provider>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
